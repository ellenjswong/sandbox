name: Check Race Advancements

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions minimum cron interval)
    - cron: '*/10 16-23 22 8 *'
  workflow_dispatch: # Allows manual trigger via the Actions tab for quick testing

jobs:
  check-marshalling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Sent Alerts Cache
        uses: actions/cache@v3
        with:
          path: sent_notifications.json
          key: sent-alerts-${{ github.run_id }}
          restore-keys: |
            sent-alerts-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests twilio

      - name: Run Advancement Checker Script
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FROM_WHATSAPP: ${{ secrets.FROM_WHATSAPP }}
          TO_WHATSAPP: ${{ secrets.TO_WHATSAPP }}
        run: python script.py

      - name: Save Sent Alerts Cache
        uses: actions/cache@v3
        if: always()
        with:
          path: sent_notifications.json
          key: sent-alerts-${{ github.run_id }}
